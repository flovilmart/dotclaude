name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: ${{ matrix.os }} · nu ${{ matrix.nu }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest nushell the scripts support (MIN_NU in selftest.nu)
          - os: ubuntu-latest
            nu: 0.114.0
            target: x86_64-unknown-linux-gnu
            sha256: 3896777ebf3678f6d41736a5e995ba8360b338eb73c713254fc024e08ec72289
          # the latest release, on Linux and on macOS (BSD userland)
          - os: ubuntu-latest
            nu: 0.116.1
            target: x86_64-unknown-linux-gnu
            sha256: d6d8ace4be491ed8abba4026e73b60c0470b4671d7039307e7d772282ef863da
          - os: macos-latest
            nu: 0.116.1
            target: aarch64-apple-darwin
            sha256: 302fb3dfc5d44e7fe0d5b8227be8e75b4c3956ca8d4804234e5c68fbdd3e4917
    steps:
      - uses: actions/checkout@v5

      # The official release tarball, checked against a pinned SHA-256; no third-party action
      - name: Install nushell ${{ matrix.nu }}
        env:
          NU_VERSION: ${{ matrix.nu }}
          NU_TARGET: ${{ matrix.target }}
          NU_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          f="nu-${NU_VERSION}-${NU_TARGET}.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/$f"
          echo "${NU_SHA256}  $RUNNER_TEMP/$f" | shasum -a 256 -c -
          tar xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nu-${NU_VERSION}-${NU_TARGET}" >> "$GITHUB_PATH"

      # node runs the saved workflows' tests; selftest skips them without it, CI must not
      - name: Tools
        run: |
          nu --version
          nu -c 'print $"os: ($nu.os-info.name)"'
          node --version
          git --version

      # Scenarios (worktrees, watcher, follow), every @test file (runner, rules, config,
      # Linear key handling, shell commands, syntax of every .nu file) and the workflow tests
      - name: selftest
        run: nu skills/linear-poll/scripts/selftest.nu
